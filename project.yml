name: BetterSound

options:
  developmentLanguage: en
  bundleIdPrefix: dev.adrbn
  deploymentTarget:
    macOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Ad-hoc by default so anyone can build. `make install` signs with a Developer ID,
    # which macOS needs to keep the audio permission across rebuilds.
    CODE_SIGN_STYLE: Manual
    BS_IDENTITY: "-"
    BS_TEAM: ""
    CODE_SIGN_IDENTITY: "$(BS_IDENTITY)"
    DEVELOPMENT_TEAM: "$(BS_TEAM)"
    ENABLE_HARDENED_RUNTIME: "YES"
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: "NO"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

targets:
  BetterSound:
    type: application
    platform: macOS
    sources: [BetterSound]
    dependencies:
      - package: Sparkle
    info:
      path: BetterSound/Info.plist
      properties:
        CFBundleDisplayName: BetterSound
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSAudioCaptureUsageDescription: BetterSound changes each app's volume as it plays. Nothing is recorded or saved.
        CFBundleDevelopmentRegion: en
        # Sparkle: updates come from the latest GitHub release, signed with an EdDSA key.
        SUFeedURL: https://github.com/adrbn/bettersound/releases/latest/download/appcast.xml
        SUPublicEDKey: xAxsYqYvDN8n1QZkFpp6ScRfqZPS6O6/ikeKbpZXFwA=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        CFBundleURLTypes:
          - CFBundleURLName: dev.adrbn.bettersound
            CFBundleURLSchemes: [bettersound]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.adrbn.bettersound
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"

