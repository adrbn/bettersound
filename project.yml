name: BetterSound

options:
  bundleIdPrefix: dev.adrbn
  deploymentTarget:
    macOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Ad-hoc by default so anyone can build. `make install` signs with a Developer ID,
    # which macOS needs to keep the audio permission across rebuilds.
    CODE_SIGN_STYLE: Manual
    BS_IDENTITY: "-"
    BS_TEAM: ""
    CODE_SIGN_IDENTITY: "$(BS_IDENTITY)"
    DEVELOPMENT_TEAM: "$(BS_TEAM)"
    ENABLE_HARDENED_RUNTIME: "YES"
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: "NO"

targets:
  BetterSound:
    type: application
    platform: macOS
    sources: [BetterSound, Shared]
    dependencies:
      - target: SoundControl
    info:
      path: BetterSound/Info.plist
      properties:
        CFBundleDisplayName: BetterSound
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSAudioCaptureUsageDescription: BetterSound changes each app's volume as it plays. Nothing is recorded or saved.
        CFBundleURLTypes:
          - CFBundleURLName: dev.adrbn.bettersound
            CFBundleURLSchemes: [bettersound]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.adrbn.bettersound
        GENERATE_INFOPLIST_FILE: "NO"

  SoundControl:
    type: app-extension
    platform: macOS
    sources: [Widget, Shared]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: BetterSound
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/SoundControl.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.adrbn.bettersound.control
